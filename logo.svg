<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 250" width="200" height="250" role="img" aria-label="The North Watch crest">
  <!-- Shield / Coat of Arms -->
  <path d="M 20 50 L 100 30 L 180 50 L 180 120 C 180 180 100 230 100 230 C 100 230 20 180 20 120 Z"
        fill="none" stroke="#60768c" stroke-width="4" stroke-linejoin="round"/>
  <path d="M 30 55 L 100 40 L 170 55 L 170 120 C 170 170 100 215 100 215 C 100 215 30 170 30 120 Z"
        fill="#141f2d" stroke="#d5dee8" stroke-width="2" stroke-linejoin="round"/>

  <!-- Distant Mountains -->
  <path d="M 35 180 L 70 130 L 85 150 L 100 120 L 130 180 Z" fill="#3c5064"/>
  <path d="M 80 180 L 110 140 L 135 170 L 160 135 L 165 180 Z" fill="#2d3f54"/>

  <!-- Central Tower -->
  <path d="M 85 90 L 85 180 L 115 180 L 115 90 Z" fill="#d5dee8"/>
  <path d="M 80 90 L 80 70 L 90 70 L 90 80 L 100 80 L 100 70 L 110 70 L 110 80 L 120 80 L 120 70 L 120 90 Z"
        fill="#d5dee8"/>
  <path d="M 100 90 L 100 180 L 115 180 L 115 90 Z" fill="#9babbe"/>

  <!-- Tower Door & Windows -->
  <path d="M 92 180 L 92 155 A 8 8 0 0 1 108 155 L 108 180 Z" fill="#0b1118"/>
  <rect x="91" y="110" width="6" height="15" rx="3" fill="#0b1118"/>
  <rect x="103" y="110" width="6" height="15" rx="3" fill="#0b1118"/>

  <!-- Top Star -->
  <path d="M 100 5 L 105 20 L 125 25 L 105 30 L 100 45 L 95 30 L 75 25 L 95 20 Z" fill="#fff">
    <animate attributeName="opacity" values="0.4; 1; 0.4" dur="2s" repeatCount="indefinite"/>
  </path>

  <!-- Side Stars -->
  <path d="M 50 80 L 52 90 L 62 92 L 52 94 L 50 104 L 48 94 L 38 92 L 48 90 Z" fill="#889cb2"/>
  <path d="M 150 80 L 152 90 L 162 92 L 152 94 L 150 104 L 148 94 L 138 92 L 148 90 Z" fill="#889cb2"/>

  <!-- Base Water/Platform lines -->
  <rect x="50" y="185" width="100" height="3" fill="#58a0cb"/>
  <rect x="65" y="193" width="70" height="3" fill="#58a0cb" opacity="0.6"/>
</svg>
